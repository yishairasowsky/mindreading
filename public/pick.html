<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The 100 List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #333;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            touch-action: manipulation;
        }
        header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        header p {
            font-size: 13px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .list-container {
            padding: 0;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 13px 16px;
            border-bottom: 1px solid #eee;
            background: white;
        }
        .list-item:nth-child(even) {
            background: #f8f9fa;
        }
        .item-number {
            font-size: 13px;
            font-weight: 700;
            color: #2c3e50;
            width: 32px;
            flex-shrink: 0;
            opacity: 0.5;
        }
        .item-name {
            font-size: 16px;
            font-weight: 400;
        }
        .highlight {
            background: #fff9c4 !important;
        }

        /* Secret overlay - very subtle */
        #secret-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.08);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #secret-overlay.active {
            display: flex;
        }
        .secret-pad {
            background: rgba(30,30,30,0.85);
            border-radius: 20px;
            padding: 20px;
            width: 240px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .secret-display {
            text-align: center;
            font-size: 36px;
            font-weight: 300;
            color: rgba(255,255,255,0.9);
            margin-bottom: 16px;
            height: 44px;
            line-height: 44px;
            letter-spacing: 4px;
        }
        .secret-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .secret-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: rgba(255,255,255,0.9);
            font-size: 22px;
            padding: 16px 0;
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.1s;
        }
        .secret-btn:active {
            background: rgba(255,255,255,0.3);
        }
        .secret-btn.confirm {
            background: rgba(76, 175, 80, 0.5);
        }
        .secret-btn.confirm:active {
            background: rgba(76, 175, 80, 0.7);
        }
        .secret-btn.clear {
            background: rgba(244, 67, 54, 0.35);
        }
        .secret-btn.clear:active {
            background: rgba(244, 67, 54, 0.55);
        }
    </style>
</head>
<body>
    <header id="header">
        <h1 id="title">The 100 List</h1>
        <p>Browse the complete list below</p>
    </header>

    <div class="list-container" id="list"></div>

    <div id="secret-overlay">
        <div class="secret-pad">
            <div class="secret-display" id="secret-display">&ndash;</div>
            <div class="secret-grid" id="secret-grid">
                <button class="secret-btn" data-d="1">1</button>
                <button class="secret-btn" data-d="2">2</button>
                <button class="secret-btn" data-d="3">3</button>
                <button class="secret-btn" data-d="4">4</button>
                <button class="secret-btn" data-d="5">5</button>
                <button class="secret-btn" data-d="6">6</button>
                <button class="secret-btn" data-d="7">7</button>
                <button class="secret-btn" data-d="8">8</button>
                <button class="secret-btn" data-d="9">9</button>
                <button class="secret-btn clear" data-a="clear">&times;</button>
                <button class="secret-btn" data-d="0">0</button>
                <button class="secret-btn confirm" data-a="go">&check;</button>
            </div>
        </div>
    </div>

    <script>

        countries: {

            items: [
                "France","Japan","Italy","Brazil","Australia","Egypt","India","Mexico",
                "Thailand","Spain","Germany","Canada","Argentina","South Korea","Turkey",
                "Greece","Portugal","Netherlands","Sweden","Norway","Denmark","Finland",
                "Switzerland","Austria","Belgium","Ireland","Scotland","Poland","Czech Republic",
                "Hungary","Croatia","Romania","Russia","Ukraine","Iceland","Morocco",
                "South Africa","Kenya","Nigeria","Tanzania","Ethiopia","Ghana","Senegal",
                "Colombia","Peru","Chile","Ecuador","Cuba","Jamaica","Costa Rica",
                "Panama","Venezuela","Uruguay","Bolivia","China","Vietnam","Indonesia",
                "Malaysia","Philippines","Singapore","Taiwan","Nepal","Sri Lanka",
                "Cambodia","Myanmar","Laos","Mongolia","Pakistan","Bangladesh","Iran",
                "Iraq","Israel","Jordan","Lebanon","Saudi Arabia","Qatar","Oman",
                "New Zealand","Fiji","Samoa","Papua New Guinea","United States",
                "United Kingdom","Luxembourg","Malta","Cyprus","Georgia","Armenia",
                "Azerbaijan","Uzbekistan","Kazakhstan","Bhutan","Maldives","Madagascar",
                "Mauritius","Seychelles","Belize","Guatemala","Honduras","Trinidad"
            ]
        }
    };

    // Seeded PRNG (mulberry32)
    function mulberry32(seed) {
        return function() {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function hashStr(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) {
            h = ((h << 5) - h + s.charCodeAt(i)) | 0;
        }
        return Math.abs(h);
    }

    function seededShuffle(arr, seed) {
        const a = arr.slice();
        const rng = mulberry32(seed);
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    let currentItems = [];
    let forceItem = null;
    let category = 'cities';

    async function init() {
        try {
            const res = await fetch('/api/pick/config');
            const config = await res.json();
            category = config.category || 'cities';
            forceItem = config.forceItem || DATA[category].items[0];
        } catch(e) {
            category = 'cities';
            forceItem = 'Paris';
        }

        const cat = DATA[category];
        document.getElementById('title').textContent = cat.title;
        document.title = cat.title;

        // Build shuffled list with force item in a neutral position
        const others = cat.items.filter(item => item !== forceItem);
        const shuffled = seededShuffle(others, hashStr(category + 'salt82'));
        // Put force item somewhere in the middle initially
        const midPos = Math.floor(shuffled.length / 2);
        shuffled.splice(midPos, 0, forceItem);
        currentItems = shuffled;

        renderList();
    }

    function renderList(highlightIndex) {
        const container = document.getElementById('list');
        container.innerHTML = '';
        currentItems.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'list-item' + (i === highlightIndex ? ' highlight' : '');
            div.id = 'item-' + i;
            div.innerHTML = `<span class="item-number">${i + 1}.</span><span class="item-name">${item}</span>`;
            container.appendChild(div);
        });
    }

    function placeForceAt(n) {
        // n is 1-indexed (1..100)
        const idx = n - 1;
        // Remove force item from current position
        const curIdx = currentItems.indexOf(forceItem);
        if (curIdx === -1) return;
        currentItems.splice(curIdx, 1);
        // Insert at target position
        currentItems.splice(idx, 0, forceItem);
        renderList();
        // Scroll to show the target item, centered on screen
        setTimeout(() => {
            const el = document.getElementById('item-' + idx);
            if (el) {
                el.scrollIntoView({ behavior: 'auto', block: 'center' });
            }
        }, 50);
    }

    // ---- Secret pad logic ----
    const overlay = document.getElementById('secret-overlay');
    const display = document.getElementById('secret-display');
    let secretValue = '';
    let tapCount = 0;
    let lastTapTime = 0;

    // Activate: triple-tap the header
    document.getElementById('header').addEventListener('click', (e) => {
        const now = Date.now();
        if (now - lastTapTime < 400) {
            tapCount++;
        } else {
            tapCount = 1;
        }
        lastTapTime = now;

        if (tapCount >= 3) {
            tapCount = 0;
            openPad();
        }
    });

    function openPad() {
        secretValue = '';
        display.textContent = '\u2013';
        overlay.classList.add('active');
    }

    function closePad() {
        overlay.classList.remove('active');
        secretValue = '';
    }

    // Handle pad button taps
    document.getElementById('secret-grid').addEventListener('click', (e) => {
        const btn = e.target.closest('.secret-btn');
        if (!btn) return;
        e.stopPropagation();

        if (btn.dataset.d !== undefined) {
            // Digit
            if (secretValue.length < 3) {
                secretValue += btn.dataset.d;
                display.textContent = secretValue;
            }
        } else if (btn.dataset.a === 'clear') {
            secretValue = '';
            display.textContent = '\u2013';
        } else if (btn.dataset.a === 'go') {
            const num = parseInt(secretValue, 10);
            if (num >= 1 && num <= 100) {
                placeForceAt(num);
                closePad();
            } else {
                display.textContent = '??';
                secretValue = '';
            }
        }
    });

    // Close pad if tapping the overlay background (not the pad itself)
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
            closePad();
        }
    });

    // ---- Voice recognition (silent force) ----
    function startVoiceListener() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;

        const recognition = new SR();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.maxAlternatives = 3;

        // Map spoken number words to digits
        const ones = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
            eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,
            eighteen:18,nineteen:19};
        const tens = {twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};

        function parseSpokenNumber(text) {
            // Normalize
            text = text.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();

            // Try direct digit match first (e.g. "47")
            const digitMatch = text.match(/\b(\d{1,3})\b/g);
            if (digitMatch) {
                for (const m of digitMatch) {
                    const n = parseInt(m, 10);
                    if (n >= 1 && n <= 100) return n;
                }
            }

            // "hundred" or "one hundred" or "a hundred"
            if (/\bhundred\b/.test(text)) return 100;

            // Try word-based parsing
            const words = text.split(/\s+/);
            for (let i = 0; i < words.length; i++) {
                const w = words[i];
                // Single word: "one" through "nineteen"
                if (ones[w]) {
                    return ones[w];
                }
                // Tens: "twenty" through "ninety", optionally followed by ones
                if (tens[w]) {
                    const next = words[i + 1];
                    if (next && ones[next] && ones[next] <= 9) {
                        return tens[w] + ones[next];
                    }
                    return tens[w];
                }
                // Hyphenated: "forty-seven"
                if (w.includes('-')) {
                    const parts = w.split('-');
                    if (tens[parts[0]] && ones[parts[1]]) {
                        return tens[parts[0]] + ones[parts[1]];
                    }
                }
            }
            return null;
        }

        let lastForceTime = 0;

        recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const result = event.results[i];
                if (!result.isFinal) continue;
                // Check all alternatives
                for (let j = 0; j < result.length; j++) {
                    const transcript = result[j].transcript;
                    const num = parseSpokenNumber(transcript);
                    if (num !== null && num >= 1 && num <= 100) {
                        // Debounce: ignore if we just placed within 3 seconds
                        const now = Date.now();
                        if (now - lastForceTime > 3000) {
                            lastForceTime = now;
                            placeForceAt(num);
                        }
                        return;
                    }
                }
            }
        };

        recognition.onend = () => {
            // Auto-restart to keep listening
            try { recognition.start(); } catch(e) {}
        };

        recognition.onerror = (e) => {
            if (e.error === 'not-allowed' || e.error === 'service-not-available') return;
            // Restart on transient errors
            setTimeout(() => {
                try { recognition.start(); } catch(e) {}
            }, 1000);
        };

        try { recognition.start(); } catch(e) {}
    }

    init();
    startVoiceListener();
    </script>
