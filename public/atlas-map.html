<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Geographic Explorer | Atlas Online</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: Arial, Helvetica, sans-serif; background: #07111e; color: #cde; overflow: hidden; }
  #page { display: flex; flex-direction: column; height: 100vh; }

  /* ── Header ── */
  #header {
    background: linear-gradient(135deg, #0d3b66 0%, #0a2a4a 100%);
    border-bottom: 2px solid #0e7fa5;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    z-index: 1000;
  }
  #logo-wrap { display: flex; align-items: center; gap: 9px; text-decoration: none; flex-shrink: 0; }
  #logo-main { color: #fff; font-size: 17px; font-weight: 700; font-family: Georgia, serif; }
  #logo-sub  { color: #7ecbdf; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; display: block; }

  #search-wrap { display: flex; flex: 1; max-width: 340px; }
  #search-input {
    flex: 1; padding: 6px 11px; font-size: 13px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-right: none; border-radius: 3px 0 0 3px; outline: none; color: #fff;
  }
  #search-input::placeholder { color: rgba(255,255,255,0.3); }
  #search-btn {
    background: #0e7fa5; color: #fff; border: none; padding: 0 13px;
    font-size: 13px; cursor: pointer; border-radius: 0 3px 3px 0; font-weight: 600;
  }
  #search-btn:hover { background: #0a6080; }

  #continent-btns { display: flex; gap: 4px; flex-shrink: 0; }
  .cont-btn {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    color: #9ecde0; padding: 5px 10px; font-size: 12px; cursor: pointer;
    border-radius: 3px; font-family: Arial, sans-serif; transition: all 0.15s; white-space: nowrap;
  }
  .cont-btn:hover, .cont-btn.active { background: #0e7fa5; border-color: #0eb8e8; color: #fff; }

  /* ── Status bar ── */
  #status-bar {
    background: #040d18;
    border-bottom: 1px solid #0e2a40;
    padding: 5px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #5a7a90;
    flex-shrink: 0;
    z-index: 1000;
  }
  #status-dot { width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 6px #2ecc71; flex-shrink: 0; }
  #hover-label { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; min-width: 180px; transition: color 0.2s; }
  #hover-label.empty { color: #2a4455; font-weight: 400; font-style: italic; }
  #hover-country { color: #7ecbdf; font-size: 12px; }
  #zoom-hint { font-size: 11px; color: #1e3a50; }

  /* ── Map ── */
  #map-wrap { position: relative; flex: 1; }
  #map { position: absolute; inset: 0; background: #a8c8e8; }

  /* Override Leaflet attribution to be subtle */
  .leaflet-control-attribution {
    font-size: 9px !important;
    opacity: 0.4;
    background: rgba(0,0,0,0.5) !important;
    color: #888 !important;
  }
  .leaflet-control-attribution a { color: #aaa !important; }

  /* ── Custom city marker ── */
  .city-marker-wrap {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .city-marker {
    width: 8px; height: 8px;
    background: #e05a20;
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 50%;
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .city-marker-wrap:hover .city-marker {
    background: #fff;
    border-color: #e05a20;
    transform: scale(1.8);
  }

  /* ── Our own city name labels ── */
  .city-name-label {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    font-family: 'Raleway', 'Helvetica Neue', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 2px #000;
    white-space: nowrap;
    pointer-events: none;
  }
  .city-name-label::before { display: none !important; }

  /* ── Country name labels (non-interactive, zoom 2–6 only) ── */
  .country-name-label {
    font-family: 'Raleway', 'Helvetica Neue', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 6px #000;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, -50%);
    display: block;
  }

  /* ── Floating tooltip ── */
  #city-label {
    position: fixed;
    pointer-events: none;
    background: rgba(7,17,30,0.97);
    border: 1px solid #0e7fa5;
    border-radius: 4px;
    padding: 9px 14px;
    display: none;
    z-index: 9999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 14px rgba(14,184,232,0.12);
    min-width: 150px;
  }
  #city-label-name    { font-size: 15px; font-weight: 700; color: #fff; display: block; margin-bottom: 3px; }
  #city-label-country { font-size: 11px; color: #7ecbdf; letter-spacing: 1px; text-transform: uppercase; display: block; }
  #city-label-coords  { font-size: 10px; color: #2a5a6a; font-family: monospace; display: block; margin-top: 4px; }

  /* tile layer toggle */
  #layer-btn {
    position: absolute;
    bottom: 30px; right: 10px;
    z-index: 999;
    background: #0d3b66;
    color: #7ecbdf;
    border: 1px solid #0e7fa5;
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    font-family: Arial, sans-serif;
  }
  #layer-btn:hover { background: #0e7fa5; color: #fff; }
</style>
</head>

/* ─── FIREBASE ───────────────────────────────────────────────────── */
let lastSent = '';
function sendPlace(name) {
  if (name === lastSent) return;
  lastSent = name;
  fetch(DB_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(name) }).catch(()=>{});
}

/* ─── LEAFLET MAP ────────────────────────────────────────────────── */
const map = L.map('map', {
  center: [20, 20],
  zoom: 2,
  minZoom: 2,
  maxZoom: 18,
  zoomControl: true,
});

// Tile layers
const satelliteLayer = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles © Esri', maxZoom: 19 }
);

const streetLayer = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles © Esri', maxZoom: 19 }
);

satelliteLayer.addTo(map);
let isSatellite = true;

document.getElementById('layer-btn').addEventListener('click', () => {
  isSatellite = !isSatellite;
  if (isSatellite) {
    map.removeLayer(streetLayer);
    satelliteLayer.addTo(map);
    document.getElementById('layer-btn').textContent = '🗺 Street';
  } else {
    map.removeLayer(satelliteLayer);
    streetLayer.addTo(map);
    document.getElementById('layer-btn').textContent = '🛰 Satellite';
  }
  updateLabels();
});

/* ─── CITY MARKERS ───────────────────────────────────────────────── */
const floatLabel   = document.getElementById('city-label');
const floatName    = document.getElementById('city-label-name');
const floatCountry = document.getElementById('city-label-country');
const floatCoords  = document.getElementById('city-label-coords');
const hoverLabel   = document.getElementById('hover-label');
const hoverCountry = document.getElementById('hover-country');

function posLabel(x, y) {
  let left = x + 16, top = y - 10;
  if (left + 180 > window.innerWidth)  left = x - 196;
  if (top  + 90  > window.innerHeight) top  = y - 90;
  floatLabel.style.left = left + 'px';
  floatLabel.style.top  = top  + 'px';
}

const dotIcon = L.divIcon({
  className: '',
  html: '<div class="city-marker-wrap"><div class="city-marker"></div></div>',
  iconSize: [28, 28],
  iconAnchor: [14, 14],
});

const allMarkers = [];

CITIES.forEach(city => {
  const marker = L.marker([city.lat, city.lon], { icon: dotIcon });

  marker.bindTooltip(city.name, {
    permanent: true,
    direction: 'right',
    className: 'city-name-label',
    offset: [5, 0],
  });

  marker.on('mouseover', function(e) {
    const label = `${city.name}, ${city.country}`;
    sendPlace(label);
    hoverLabel.textContent = city.name;
    hoverLabel.className = '';
    hoverCountry.textContent = '· ' + city.country;

    floatName.textContent    = city.name;
    floatCountry.textContent = `${city.country}  ·  ${city.continent}`;
    floatCoords.textContent  = `${city.lat.toFixed(3)}°, ${city.lon.toFixed(3)}°`;
    floatLabel.style.display = 'block';
    posLabel(e.originalEvent.clientX, e.originalEvent.clientY);
  });

  marker.on('mousemove', function(e) {
    posLabel(e.originalEvent.clientX, e.originalEvent.clientY);
  });

  marker.on('mouseout', function() {
    hoverLabel.textContent = 'Hover over any city to explore…';
    hoverLabel.className = 'empty';
    hoverCountry.textContent = '';
    floatLabel.style.display = 'none';
  });

  marker.addTo(map);
  allMarkers.push(marker);
});

/* ─── ZOOM-BASED LABEL VISIBILITY ────────────────────────────────── */
function updateLabels() {
  const zoom = map.getZoom();
  // City dot labels: satellite only (street tiles already label cities)
  allMarkers.forEach(m => {
    if (isSatellite && zoom >= 7) m.openTooltip();
    else m.closeTooltip();
  });
  // Country name labels: satellite only, middle zoom range
  countryMarkers.forEach(m => {
    const el = m.getElement();
    if (el) el.style.visibility = (isSatellite && zoom >= 4 && zoom <= 6) ? 'visible' : 'hidden';
  });
}
map.on('zoomend', updateLabels);
updateLabels();

    const v = VIEWS[btn.dataset.cont];
    if (v) map.flyTo(v.center, v.zoom, { duration: 1.2 });
  });
});

/* ─── SEARCH ─────────────────────────────────────────────────────── */
document.getElementById('search-btn').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function doSearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if (!q) return;
  const city = CITIES.find(c => c.name.toLowerCase().includes(q));
  if (city) {
    map.flyTo([city.lat, city.lon], 10, { duration: 1.2 });
    return;
  }
  const cont = Object.keys(VIEWS).find(k => k.toLowerCase().includes(q));
  if (cont) document.querySelector(`.cont-btn[data-cont="${cont}"]`)?.click();
}
